- title: First Proof
  id: https://arxiv.org/abs/2602.05192v2
  type: paper
  location: Question 4
  relationship: formalizes
  note: >-
    Source of the convolution and root-functional definitions and the Question 4 statement. The submitted
    inequality cases have degrees 2 and 3; the degree theorem is a supporting coefficient fact.
- title: The finite free Stam inequality
  authors:
  - Jorge Garza Vargas
  - Nikhil Srivastava
  - Zack Stier
  id: https://arxiv.org/html/2602.05192v2
  type: paper
  location: First Proof v2, Appendix B.4, Theorem B.1
  relationship: formalizes
  note: >-
    The general mathematical theorem includes the selected degree-2 and degree-3 inequalities. The
    fork supplies direct low-degree proofs, without a novelty claim for the inequality or algebraic
    identities.
- title: The length of an s-increasing sequence of r-tuples
  authors:
  - W. T. Gowers
  - Jason Long
  id: https://arxiv.org/abs/1609.08688v2
  type: paper
  location: 'Section 1.1: Proposition 1.4 (lower bound), Lemma 1.7, and the immediately following
    paragraph'
  relationship: formalizes
  note: >-
    The selected results are the square-size construction and two product-amplification consequences
    for 2-increasing triples. The later main upper-bound and comparable-set results are outside this
    scope.
