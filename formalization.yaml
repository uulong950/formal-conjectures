version: v0.4
project:
  name: Lean Formalization of First Proof Q4 and s-Increasing Tuples
  description: >-
    Six selected Lean 4 proofs: degree preservation for finite additive convolution of arbitrary real
    degree-n polynomials; the finite free Stam inequality 1/Phi(p boxplus_n q) >= 1/Phi(p) + 1/Phi(q)
    for monic real-rooted polynomials at n=2 and n=3, including repeated roots; and three Gowers--Long
    results for the maximum length F(n) of a sequence of triples in {1,...,n}^3 in which every earlier
    triple is strictly smaller than every later triple in at least two coordinates. The sequence results
    are F(m^2) >= m^3 for natural m; arbitrarily large M with F(M) >= M^e if n>1 and F(n)=n^e; and
    F(M) >= M^b for all sufficiently large M for each b<e under the same hypotheses. Proofs use leading
    coefficients, quadratic root gaps, cubic discriminants and a sum-of-squares identity, and explicit
    sequence products. The README explains each claim, proof route, source, audience, and relation
    to prior formalizations, including the registered square lower bound PALOMAR-2026-11-13-000015.
    The contribution is the specific proof implementation; mathematical priority and first-formalization
    status are not claimed.
  authors:
  - Zhang Xiaolong
  license: Apache-2.0
  responsible_maintainers:
  - Zhang Xiaolong
classification:
  arxiv:
  - math.CO
  - math.CA
  msc2020:
  - 05D05
  - 05D10
  - 26D15
