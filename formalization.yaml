  prompting_notes: >-
    Interactive assistance for Lean proof development, compiler error diagnosis, formalization refinement,
    and checking theorem axiom dependencies.
  notes: >-
    Zhang Xiaolong is responsible for the formalization and used ChatGPT as an interactive proof-development
    assistant. A subsequent documentation and provenance update was prepared with ChatGPT assistance
    after inspecting the pinned source files and related public formalizations. That update adds no
    Lean proof code.
fidelity:
  divergences: >-
    The six selected statements and their definitions are preserved from the previously mechanically
    verified snapshot. The README states every condition and conclusion and explains Nat.sqrt, root
    multiplicities, ENNReal reciprocal conventions, and frequently versus eventually atTop. Source-level
    comparisons with existing Gowers--Long proofs are documented. No checked Lean bridge to Archon
    definitions or cross-project proof-equivalence certificate is claimed. Four unfinished declarations
    in the two substantive files are outside the selected scope.
